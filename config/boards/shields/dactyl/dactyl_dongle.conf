# The dongle is the BLE central; it talks to the host over USB and to the
# left/right halves over BLE, so it needs enough connections for both.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Stay awake - it's USB powered, not battery powered.
CONFIG_ZMK_SLEEP=n

# OLED status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

CONFIG_ZMK_KEYBOARD_NAME="Dactyl"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
